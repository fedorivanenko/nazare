name: performance

on:
  schedule:
    - cron: "0 4 * * *"
  pull_request:
    paths:
      - "packages/compiler/**"
      - "packages/source/**"
      - "packages/target-shopify/**"
      - "packages/cli-client/**"
      - "benchmarks/**"
      - "fixtures/**"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds both sides from source and runs them interleaved in one job, because
  # a shared runner's absolute numbers drift between jobs while a difference
  # measured back to back on one runner holds up.
  inspect-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # ab.sh resolves a baseline ref and adds a worktree for it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A pull request is asking "does this change cost anything", so it
      # compares against its merge base. The nightly is asking "have we drifted
      # since we shipped", and comparing a merge commit against its own parent
      # would answer neither.
      - name: resolve baseline
        id: baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi
      - name: inspect theme A/B
        env:
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
          # Pull requests must explicitly declare intentional graph contract
          # changes. Scheduled and manual runs compare released versions, where
          # output changes are expected.
          ALLOW_OUTPUT_CHANGE: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'performance-output-change')) && '1' || '' }}
          # A runner is fast enough that the smaller scales land under the
          # gate's one-second floor, where a cell measures process startup
          # rather than analysis. 64 and 96 are what it actually watches.
          SCALES: "1,16,64,96"
          RUNS: "3"
          # Shared runners are noisy, so the budget is wide.
          MAX_COLD_REGRESSION: "15"
          # Absolute user-facing budget. Unlike relative A/B CPU gating, this
          # includes process startup, filesystem discovery, reads, and output.
          MAX_COLD_MS: "10000"
          MAX_COLD_SCALE: "64"
          REPORT_PATH: inspect-ab.txt
        run: benchmarks/ab.sh
      - name: enforce persistent inspect latency
        run: |
          set -o pipefail
          node benchmarks/inspect-incremental.mjs \
            --scale 64 \
            --runs 20 \
            --max-initial-ms 10000 \
            --max-incremental-ms 500 \
            | tee inspect-incremental.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-performance
          path: |
            inspect-ab.txt
            inspect-incremental.txt
          if-no-files-found: warn
