name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          # Build native artifacts at the minimum supported ABI. The runtime
          # and grammar bindings are then exercised by the full suite.
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s typecheck
      - run: pnpm dlx @biomejs/biome@2.4.14 check .
      - run: pnpm -s test:all
      - run: ./scripts/package-cli.sh "${GITHUB_REF_NAME}" "${{ matrix.target }}"
      - run: ./scripts/package-source-cli.sh "${GITHUB_REF_NAME}" "${{ matrix.target }}"
      - run: ./scripts/smoke-packaged-cli.sh .release/nazare-cli-*.tar.gz
      - run: ./scripts/smoke-packaged-source-cli.sh .release/nazare-source-*.tar.gz
      - run: ./scripts/smoke-installer.sh "${GITHUB_REF_NAME}" cli
      - run: ./scripts/smoke-installer.sh "${GITHUB_REF_NAME}" source
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            .release/*.tar.gz
            .release/*.tar.gz.sha256
