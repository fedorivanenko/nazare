name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s typecheck
      - run: pnpm dlx @biomejs/biome@2.4.14 check .
      - run: pnpm -s test:all
      - run: ./scripts/package-cli.sh "${GITHUB_REF_NAME}"
      - run: ./scripts/smoke-packaged-cli.sh .release/*.tar.gz
      - run: ./scripts/smoke-installer.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            .release/*.tar.gz
            .release/*.tar.gz.sha256
